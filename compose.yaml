services:
  backend1:
    build: .
    environment:
      SERVER_NAME: Backend-Server-1

  backend2:
    build: .
    environment:
      SERVER_NAME: Backend-Server-2

  backend3:
    build: .
    environment:
      SERVER_NAME: Backend-Server-3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
